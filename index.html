<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Augmium WebAR Prototype</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    .overlay {
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      color: #fff; background: rgba(0,0,0,0.55); padding: 10px 14px;
      border-radius: 8px; font-size: 13px; z-index: 999; text-align: center;
    }
  </style>
</head>
<body>
  <div class="overlay">Point your camera at the target image. Augmium prototype — placeholder geometry only.</div>

  <!--
    IMPORTANT: replace "targets.mind" below with the path to the .mind file
    you compile at https://hiukim.github.io/mind-ar-js-doc/tools/compile/
    Both files (this index.html and targets.mind) must be hosted together.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <!--
        FUTURE 3D ASSET: when your real model is ready, export as .glb,
        name it "model.glb", place it in an "assets" folder next to index.html,
        then uncomment the line below and swap the placeholder <a-box>/<a-text>
        further down for: <a-gltf-model src="#augmiumModel" position="0 0 0" scale="0.1 0.1 0.1"></a-gltf-model>

        <a-asset-item id="augmiumModel" src="./assets/model.glb"></a-asset-item>
      -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- This entity is anchored to target index 0 (the first/only image you compiled) -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Placeholder geometry: swap this out for your real 3D asset later -->
      <a-box
        position="0 0.25 0"
        rotation="0 45 0"
        scale="0.3 0.3 0.3"
        color="#C9A24B"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 4000; easing: linear"
      ></a-box>

      <a-text
        value="AUGMIUM"
        align="center"
        position="0 -0.15 0"
        scale="0.7 0.7 0.7"
        color="#F4EFE6"
      ></a-text>

    </a-entity>
  </a-scene>
</body>
</html>
